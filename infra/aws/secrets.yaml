AWSTemplateFormatVersion: '2010-09-09'
Description: CEVOC — Secrets Manager secret and IAM policy for ECS task role

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub cevoc/${Environment}/app
      Description: !Sub 'CEVOC ${Environment} application secrets (API keys, connection strings)'
      # Initial value is a placeholder — populate via AWS Console or CLI after deploy
      SecretString: '{"REVENUE_NSW_API_KEY":"CHANGE_ME","DB_CONNECTION_STRING":"CHANGE_ME"}'
      Tags:
        - Key: Project
          Value: cevoc
        - Key: Environment
          Value: !Ref Environment

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cevoc-${Environment}-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
      Tags:
        - Key: Project
          Value: cevoc
        - Key: Environment
          Value: !Ref Environment

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cevoc-${Environment}-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: cevoc
        - Key: Environment
          Value: !Ref Environment

Outputs:
  SecretArn:
    Value: !Ref AppSecret
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
