server.port=8080
# Lookup adapter: the ONE setting that picks the lookup route (env CEVOC_PENALTY_LOOKUP_ADAPTER). Optional override: empty or unset = browser.
#   browser default. Chromium route to the Revenue NSW page (temporary: delete at cutover; needs the live-browser build, which the
#           Docker image always has). Needs a contact (cevoc.scraper.evidence.contact); without it lookups answer "not available" and the
#           start-up log says why. The address has a fully qualified default.
#   stub    explicit choice only. Bundled fictitious notices; unknown numbers answer "live lookup is switched off". Nothing is contacted.
#   http    plain HTTP route to the Revenue NSW JSON service (interim: removed when the TfNSW API exists).
#   api     direct API route; reserved, not built yet (selecting it stops start-up).
# Any other value is NOT an alias: it falls back to stub with a warning. The property is deliberately not set in this file.
# media links: stub (sample files under base-url, no cloud), memory (captured images held in memory for a short time and
# served from /api/media/<token>) or azure-blob (short-lived read-only SAS URLs).
# cevoc.media.adapter is left unset on purpose: unset means memory when the lookup adapter is browser (the default) or http, else stub.
# Override with CEVOC_MEDIA_ADAPTER. memory only: cevoc.media.public-base-url (default empty = relative links),
# cevoc.media.memory.retention-minutes=20, cevoc.media.memory.max-megabytes=96
cevoc.media.base-url=/samples
# azure-blob only:
# cevoc.media.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
# cevoc.media.azure.container=evidence
# Front end origins allowed to call /api (comma separated). Override with CEVOC_CORS_ALLOWED_ORIGINS.
cevoc.cors.allowed-origins=https://calm-water-028cfd500.3.azurestaticapps.net
# Certificates adapter choice: cevoc.certificates.providers (env CEVOC_CERTIFICATES_PROVIDERS), an ordered list using the same
# names as the lookup adapter: http, browser, api (reserved). Empty or unset = browser (default). none = no certificate source.
# Unknown names are ignored with a warning. Page address default: https://cevoc.transport.nsw.gov.au/cevoc/pages/sdro/searchCertificates.jsf
# Legacy provider http-form is only used when listed in the providers. Tuning:
# cevoc.scraper.certificates.key-strategy=VIA_ENFORCEMENT_SITE (default; location code + date range) | BY_PENALTY (NOT supported by the real page)
# cevoc.scraper.certificates.window-margin-minutes=  (unset = whole offence day 00:00-23:59; otherwise offence time +/- N minutes)
# Browser (Chromium) evidence route: the default lookup adapter (and used by the browser certificates provider).
# url = the one fully qualified login page address (env CEVOC_SCRAPER_EVIDENCE_URL); default https://www.apps09.revenue.nsw.gov.au/customer_service/finesonline/
# contact = REQUIRED, no default (env CEVOC_SCRAPER_EVIDENCE_CONTACT); it goes in the User-Agent. Blank: the route says so at start-up and answers "not available".
# cevoc.scraper.evidence.url=
# cevoc.scraper.evidence.contact=
# cevoc.scraper.evidence.min-interval-ms=5000
# Plain HTTP route to the Revenue NSW JSON service (no browser). Used only when cevoc.penalty-lookup.adapter=http AND
# base-url (https, host on the allow-list), path-prefix, contact and approval-reference are all set. Never the default.
# Env: CEVOC_REVENUE_NSW_HTTP_BASE_URL, ..._PATH_PREFIX, ..._CONTACT, ..._APPROVAL_REFERENCE
# cevoc.revenue-nsw-http.base-url=
# cevoc.revenue-nsw-http.path-prefix=
# cevoc.revenue-nsw-http.contact=
# cevoc.revenue-nsw-http.approval-reference=
# cevoc.revenue-nsw-http.authorization-scheme=   (empty = the bare token; UNTESTED)
# cevoc.revenue-nsw-http.offence-date-format=yyyy-MM-dd   (format of offenceDate in the token call body; UNTESTED)
# cevoc.revenue-nsw-http.min-interval-ms=1000 (floor 500)  connect-timeout-ms=5000  request-timeout-ms=15000  summary-retries=1 (max 2)
# Demo data (fictitious ten-digit notice numbers, docs/DEMO-DATA.md). OFF by default.
# Set CEVOC_DEMO_DATA_ENABLED=true on the Container App to turn it on (never with real data or a real audience).
# Only the lowercase word true turns it on; unset or anything else means off. The old name CEVOC_DEMO_DATA is retired and ignored.
# This is the one switch; only DemoDataConfig reads it.
cevoc.demo-data.enabled=${CEVOC_DEMO_DATA_ENABLED:false}

# Demo content bundle (docs/DEMO-DATA.md, decision record 0018). Only read while the demo switch is on.
# Empty URL: the built-in sample content is used and nothing is fetched. With a URL, version and sha256 must both be set;
# any failure (unreachable, bad checksum, wrong version, missing licence) turns demo content off, the app still starts.
cevoc.demo-bundle.url=${CEVOC_DEMO_BUNDLE_URL:}
cevoc.demo-bundle.version=${CEVOC_DEMO_BUNDLE_VERSION:}
cevoc.demo-bundle.sha256=${CEVOC_DEMO_BUNDLE_SHA256:}
