server.port=8080
# manifest (default: manifest.json first, then live source if enabled) | stub; later: revenue-nsw or evidence-api
# Override with CEVOC_PENALTY_LOOKUP_ADAPTER.
cevoc.penalty-lookup.adapter=manifest
# Live lookup against source sites stays off until approvals are in place. Override with CEVOC_SCRAPER_ENABLED.
cevoc.scraper.enabled=false
# "scraper-evidence" exists but is never default and needs owner approval first (see docs/ARCHITECTURE.md)
# media links: stub (sample files under base-url, no cloud), memory (captured images held in memory for a short time and
# served from /api/media/<token>) or azure-blob (short-lived read-only SAS URLs).
# cevoc.media.adapter is left unset on purpose: unset means memory when cevoc.penalty-lookup.adapter=scraper-evidence, else stub.
# Override with CEVOC_MEDIA_ADAPTER. memory only: cevoc.media.public-base-url (default empty = relative links),
# cevoc.media.memory.retention-minutes=20, cevoc.media.memory.max-megabytes=96
cevoc.media.base-url=/samples
# azure-blob only:
# cevoc.media.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
# cevoc.media.azure.container=evidence
# Front end origins allowed to call /api (comma separated). Override with CEVOC_CORS_ALLOWED_ORIGINS.
cevoc.cors.allowed-origins=https://calm-water-028cfd500.3.azurestaticapps.net
# Certificates: OFF by default (no provider listed). Ordered provider list, e.g. search-page (interim, owner-approved 2026-11-04) now,
# later tfnsw-api,search-page. Every provider that contacts a source needs the owner's approval reference.
# cevoc.certificates.providers=   (env CEVOC_CERTIFICATES_PROVIDERS)
# cevoc.certificates.approval-reference=   (env CEVOC_CERTIFICATES_APPROVAL_REFERENCE)
# Legacy provider http-form: OFF by default. robots.txt of the source disallows automated access; needs the owner's approval.
# cevoc.scraper.certificates.enabled=false   (env CEVOC_SCRAPER_CERTIFICATES_ENABLED)
# cevoc.scraper.certificates.approval-reference=   (required when enabled)
# cevoc.scraper.certificates.key-strategy=VIA_ENFORCEMENT_SITE (default; location code + date range) | BY_PENALTY (NOT supported by the real page)
# cevoc.scraper.certificates.window-margin-minutes=  (unset = whole offence day 00:00-23:59; otherwise offence time +/- N minutes)
# Prototype evidence scraper. OFF unless cevoc.penalty-lookup.adapter=scraper-evidence AND enabled=true.
# Needs the site owner's approval before ever being switched on. Do not enable in any shared config.
# Env: CEVOC_SCRAPER_EVIDENCE_ENABLED (default false), CEVOC_SCRAPER_EVIDENCE_BASE_URL, CEVOC_SCRAPER_EVIDENCE_CONTACT
cevoc.scraper.evidence.enabled=false
# cevoc.scraper.evidence.base-url=
# cevoc.scraper.evidence.contact=
# cevoc.scraper.evidence.min-interval-ms=5000
# Plain HTTP route to the Revenue NSW JSON service (no browser). OFF unless cevoc.penalty-lookup.adapter=revenue-nsw-http AND
# enabled=true AND base-url (https, host on the allow-list), path-prefix, contact and approval-reference are all set. Never the default.
# Env: CEVOC_REVENUE_NSW_HTTP_ENABLED (default false), CEVOC_REVENUE_NSW_HTTP_BASE_URL, ..._PATH_PREFIX, ..._CONTACT, ..._APPROVAL_REFERENCE
cevoc.revenue-nsw-http.enabled=false
# cevoc.revenue-nsw-http.base-url=
# cevoc.revenue-nsw-http.path-prefix=
# cevoc.revenue-nsw-http.contact=
# cevoc.revenue-nsw-http.approval-reference=
# cevoc.revenue-nsw-http.authorization-scheme=   (empty = the bare token; UNTESTED)
# cevoc.revenue-nsw-http.offence-date-format=yyyy-MM-dd   (format of offenceDate in the token call body; UNTESTED)
# cevoc.revenue-nsw-http.min-interval-ms=1000 (floor 500)  connect-timeout-ms=5000  request-timeout-ms=15000  summary-retries=1 (max 2)
# Demo data (fictitious ten-digit notice numbers, docs/DEMO-DATA.md). ON by default during the prototype.
# Set CEVOC_DEMO_DATA=false on the Container App to turn it off (do so before any real data or real audience).
# Anything other than true means off. This is the one switch; only DemoDataConfig reads it.
cevoc.demo-data=${CEVOC_DEMO_DATA:true}
