server.port=8080
# stub now; later: revenue-nsw (pass-through) or evidence-api. "scraper-evidence" exists but needs owner approval first (see docs/ARCHITECTURE.md)
cevoc.penalty-lookup.adapter=stub
# media links: stub (sample files under base-url, no cloud) or azure-blob (short-lived read-only SAS URLs)
cevoc.media.adapter=stub
cevoc.media.base-url=/samples
# azure-blob only:
# cevoc.media.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
# cevoc.media.azure.container=evidence
# Front end origins allowed to call /api (comma separated). Override with CEVOC_CORS_ALLOWED_ORIGINS.
cevoc.cors.allowed-origins=https://calm-water-028cfd500.3.azurestaticapps.net
# Prototype evidence scraper. OFF unless cevoc.penalty-lookup.adapter=scraper-evidence AND enabled=true.
# Needs the site owner's approval before ever being switched on. Do not enable in any shared config.
# Env: CEVOC_SCRAPER_EVIDENCE_ENABLED (default false), CEVOC_SCRAPER_EVIDENCE_BASE_URL, CEVOC_SCRAPER_EVIDENCE_CONTACT
cevoc.scraper.evidence.enabled=false
