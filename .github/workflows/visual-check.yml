name: Visual check (screenshots)
# Separate from App CI on purpose: it never gates a merge. Invented data only, no access to any real site.
on:
  workflow_dispatch:
  pull_request:
    paths: ['frontend/**', 'scripts/visual-check.mjs', '.github/workflows/visual-check.yml']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: prototype
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/visual-check.mjs --out visual-check-output
      - run: cat visual-check-output/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-check
          path: |
            visual-check-output/prototype
            visual-check-output/mockup
            visual-check-output/text
            visual-check-output/report.*
