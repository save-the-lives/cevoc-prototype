name: Deployment smoke tests
# Reads LIVE_CASES_PASS and LIVE_CASES_FAIL secrets (JSON arrays).
# Each case is sent to the deployed app's public streaming endpoint and checked
# against its expect block. Values are masked; nothing from the secrets is echoed.
#
# Case format (placeholders — real values in the secrets):
#   {"id":"paid-speed","description":"Paid speed fine","program":"speed",
#    "tags":["smoke"],"input":{"notice":"<10 digits>","date":"<yyyy-mm-dd>","plate":"<rego>"},
#    "expect":{"status":"FOUND","noticeStatus":"PAID","minPhotos":1,"certificates":"covered"}}
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated tags to filter (e.g. 'smoke'). Empty = all cases."
        type: string
        default: ""
      route:
        description: "Expected lookup route (source field). Empty = any. 'REVENUE_NSW' = browser, 'REVENUE_NSW_HTTP' = HTTP."
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
env:
  APP_NAME: cevoc-backend
  RESOURCE_GROUP: cevoc
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CEVOCBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Resolve FQDN
        id: prep
        env:
          LIVE_CASES_PASS: ${{ secrets.LIVE_CASES_PASS }}
          LIVE_CASES_FAIL: ${{ secrets.LIVE_CASES_FAIL }}
        run: |
          set +x
          [ -n "$LIVE_CASES_PASS" ] || [ -n "$LIVE_CASES_FAIL" ] || { echo "::error::Neither LIVE_CASES_PASS nor LIVE_CASES_FAIL is set."; exit 1; }
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "base_url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Mask sensitive input values
        env:
          LIVE_CASES_PASS: ${{ secrets.LIVE_CASES_PASS }}
          LIVE_CASES_FAIL: ${{ secrets.LIVE_CASES_FAIL }}
        run: |
          # Register each notice number, date and plate as a masked value so
          # they are hidden in all subsequent log lines, even if test code
          # accidentally prints them. Masking is log-only — process.env is
          # unaffected.
          node <<'MASK_SCRIPT'
          function mask(envName) {
            const raw = (process.env[envName] || "").trim();
            if (!raw) return;
            let cases;
            try { cases = JSON.parse(raw); } catch { return; }
            if (!Array.isArray(cases)) return;
            for (const c of cases) {
              if (c.input && c.input.notice)      console.log("::add-mask::" + c.input.notice);
              if (c.input && c.input.date)         console.log("::add-mask::" + c.input.date);
              if (c.input && c.input.plate)        console.log("::add-mask::" + c.input.plate);
              if (c.input && c.input.familyName)   console.log("::add-mask::" + c.input.familyName);
              if (c.input && c.input.givenNames)   console.log("::add-mask::" + c.input.givenNames);
              if (c.input && c.input.organisation) console.log("::add-mask::" + c.input.organisation);
            }
          }
          mask("LIVE_CASES_PASS");
          mask("LIVE_CASES_FAIL");
          MASK_SCRIPT

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run smoke tests
        working-directory: frontend
        env:
          PDVT_BASE_URL: ${{ steps.prep.outputs.base_url }}
          PDVT_TAGS: ${{ inputs.tags }}
          LIVE_CASES_PASS: ${{ secrets.LIVE_CASES_PASS }}
          LIVE_CASES_FAIL: ${{ secrets.LIVE_CASES_FAIL }}
        run: npx vitest run src/pdvt.test.js --reporter=verbose
