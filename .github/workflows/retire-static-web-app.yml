name: Retire the Static Web App (one-off)
# Owner direction 2026-11-17: the site is served by the app container (record 0031), so the Static Web App in
# rg-cevoc-dev is deleted. Manual, run once, then this file is removed. Deletes ONLY Static Web Apps in rg-cevoc-dev.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-rg-cevoc-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Delete every Static Web App in the resource group
        run: |
          NAMES=$(az staticwebapp list --resource-group "$RG_NAME" --query '[].name' -o tsv)
          if [ -z "$NAMES" ]; then echo "::notice::No Static Web App in $RG_NAME; nothing to do"; exit 0; fi
          for N in $NAMES; do
            echo "Deleting Static Web App $N"
            # --no-wait: polling the delete needs a subscription-level read this identity does not have; the result is
            # checked below by listing the resource group instead.
            az staticwebapp delete --name "$N" --resource-group "$RG_NAME" --yes --no-wait
          done
          for i in $(seq 1 30); do
            LEFT=$(az staticwebapp list --resource-group "$RG_NAME" --query 'length(@)' -o tsv)
            [ "$LEFT" = "0" ] && break
            echo "  still present: $LEFT (check $i/30)"; sleep 20
          done
          LEFT=$(az staticwebapp list --resource-group "$RG_NAME" --query 'length(@)' -o tsv)
          [ "$LEFT" = "0" ] || { echo "::error::$LEFT Static Web App(s) still present"; exit 1; }
          echo "::notice::Static Web App(s) deleted: $NAMES"
