name: Check frontend (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium
      - name: Check SWA page
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            const logs = [];
            const failed = [];
            page.on('console', msg => logs.push(msg.type() + ': ' + msg.text()));
            page.on('pageerror', err => errors.push(err.message));
            page.on('requestfailed', req => failed.push(req.url() + ' -> ' + (req.failure()?.errorText || 'unknown')));
            page.on('response', resp => { if (resp.status() >= 400) failed.push(resp.url() + ' -> HTTP ' + resp.status()); });
            try {
              const resp = await page.goto('https://blue-glacier-02525ce00.3.azurestaticapps.net', { timeout: 30000, waitUntil: 'networkidle' });
              console.log('HTTP status:', resp?.status());
              console.log('Title:', await page.title());
              const text = await page.textContent('body');
              console.log('Body text (first 500):', text.substring(0, 500));
              console.log('Body length:', text.length);
            } catch(e) { console.log('NAV ERROR:', e.message); }
            console.log('=== Console logs ===');
            logs.forEach(l => console.log(' ', l));
            console.log('=== Page errors ===');
            errors.forEach(e => console.log(' ', e));
            console.log('=== Failed/4xx+ requests ===');
            failed.forEach(f => console.log(' ', f));
            await browser.close();
          })();
          "
