name: Regenerate demo artifacts
# docs/DEMO-DATA.md and scripts/visual-check-demo-cases.json are generated from the demo case list (DemoArtifactsTest).
# Maven cannot run in the agent's sandbox, so this regenerates them here and commits them to main when they changed.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Regenerate
        working-directory: backend
        run: mvn -q -B test -Dtest=DemoArtifactsTest -Dcevoc.demo.regenerate=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: Show what changed
        run: git diff --stat
      - name: Commit the regenerated files
        run: |
          git add docs/DEMO-DATA.md scripts/visual-check-demo-cases.json
          if git diff --cached --quiet; then echo "::notice::Already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Regenerate demo artifacts (docs/DEMO-DATA.md, visual-check fixture)"
          git push origin HEAD:main
