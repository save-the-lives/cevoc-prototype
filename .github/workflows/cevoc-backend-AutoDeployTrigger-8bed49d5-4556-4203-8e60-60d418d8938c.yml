name: Trigger auto deployment for cevoc-backend

# Builds the backend image on GitHub, pushes it to GitHub Container Registry (ghcr.io)
# and points the Azure Container App at it. No Azure Container Registry / ACR Tasks needed.
# One-time step: after the first run, make the package public (see docs/DEPLOY-AZURE.md).
on:
  push:
    branches: [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/cevoc-backend-AutoDeployTrigger-8bed49d5-4556-4203-8e60-60d418d8938c.yml'
  workflow_dispatch:

concurrency:
  group: cevoc-backend-deploy
  cancel-in-progress: false

env:
  APP_NAME: cevoc-backend
  RESOURCE_GROUP: cevoc
  IMAGE: ghcr.io/save-the-lives/cevoc-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Azure OIDC login
      contents: read
      packages: write   # push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (layer cache, tests skipped; tests run in App CI)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CEVOCBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      # Public package route: no pull credentials. If the package is still private the
      # revision will fail to pull; make it public once (docs/DEPLOY-AZURE.md).
      - name: Deploy new image (port 8080)
        run: |
          az containerapp ingress update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --target-port 8080
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"

      - name: Report revision health and URL
        run: |
          sleep 45
          az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,traffic:properties.trafficWeight}" -o table
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend URL: https://$fqdn  (test with notice 9000000001)"
