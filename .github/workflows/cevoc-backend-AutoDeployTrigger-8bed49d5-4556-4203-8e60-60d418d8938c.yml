name: Trigger auto deployment for cevoc-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/cevoc-backend-AutoDeployTrigger-8bed49d5-4556-4203-8e60-60d418d8938c.yml'

  # Allow manual trigger 
  workflow_dispatch:

concurrency:
  group: cevoc-backend-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cevoc-backend
  APP_NAME: cevoc-backend
  RESOURCE_GROUP: cevoc
  GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
  # Owner-run live check. OFF unless the repository VARIABLE LIVE_CHECK_ENABLED is exactly 'true' (see docs/LIVE-CHECK.md).
  LIVE: ${{ vars.LIVE_CHECK_ENABLED == 'true' && 'true' || 'false' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to Azure
      contents: read
      packages: write # push the image to GitHub Container Registry

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      # Azure ACR Tasks is blocked on this subscription, so the image is built on the GitHub
      # runner and stored in GitHub Container Registry (free for public repos).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check live-check settings
        if: ${{ env.LIVE == 'true' }}
        env:
          LIVE_CHECK_TOKEN: ${{ secrets.LIVE_CHECK_TOKEN }}
          CEVOC_BASE_URL: ${{ vars.CEVOC_BASE_URL }}
          LIVE_CONTACT: ${{ vars.LIVE_CONTACT }}
        run: |
          echo "::notice::LIVE_CHECK_ENABLED is true: building and deploying the live-check variant (cpu 2, memory 4Gi)."
          case "$CEVOC_BASE_URL" in https://?*) ;; *) echo "::error::Variable CEVOC_BASE_URL must be an https URL."; exit 1;; esac
          [ -n "$LIVE_CONTACT" ] || { echo "::error::Variable LIVE_CONTACT is not set."; exit 1; }

      - name: Build and push image
        if: ${{ env.LIVE != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Live variant: own tag, never :latest, so the default image is never replaced by it.
      - name: Build and push live-check image
        if: ${{ env.LIVE == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: LIVE_BROWSER=true
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-live
          cache-from: type=gha,scope=live
          cache-to: type=gha,scope=live,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CEVOCBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      # Optional: only needed while the package is private. Add repo secret GHCR_PULL_TOKEN
      # (classic PAT with read:packages). Skipped when the package is public.
      - name: Let the app pull from ghcr.io (private package only)
        if: ${{ env.GHCR_PULL_TOKEN != '' }}
        run: |
          # Setting the registry makes a new revision (about 90 s), so only do it when it is not already set.
          have=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "length(properties.configuration.registries[?server=='ghcr.io'])" -o tsv)
          if [ "$have" = "0" ] || [ -z "$have" ]; then
            az containerapp registry set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io --username "${{ github.repository_owner }}" --password "$GHCR_PULL_TOKEN"
          else
            echo "ghcr.io registry already set; skipping"
          fi

      - name: Deploy new image
        if: ${{ env.LIVE != 'true' }}
        run: |
          # One active revision at a time, so the newest one always gets 100% traffic.
          az containerapp revision set-mode --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --mode single
          az containerapp ingress enable --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --type external --target-port 8080 --transport auto
          # Also switches the live-check settings off again if an earlier run turned them on (empty value = off / unset).
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" --cpu 0.5 --memory 1.0Gi \
            --min-replicas 1 --max-replicas 1 \
            --set-env-vars CEVOC_PENALTY_LOOKUP_ADAPTER=manifest CEVOC_SCRAPER_ENABLED=false \
            CEVOC_SCRAPER_EVIDENCE_ENABLED=false CEVOC_SCRAPER_CERTIFICATES_ENABLED=false \
            CEVOC_SCRAPER_EVIDENCE_BROWSER= CEVOC_LIVECHECK_ENABLED=false CEVOC_LIVECHECK_TOKEN= \
            CEVOC_SCRAPER_EVIDENCE_BASE_URL= CEVOC_SCRAPER_EVIDENCE_CONTACT=
          az containerapp secret remove --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --secret-names live-check-token >/dev/null 2>&1 || true

      - name: Deploy live-check image
        if: ${{ env.LIVE == 'true' }}
        env:
          LIVE_CHECK_TOKEN: ${{ secrets.LIVE_CHECK_TOKEN }}
          CEVOC_BASE_URL: ${{ vars.CEVOC_BASE_URL }}
          LIVE_CONTACT: ${{ vars.LIVE_CONTACT }}
        run: |
          echo "::add-mask::$LIVE_CHECK_TOKEN"
          az containerapp revision set-mode --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --mode single
          az containerapp ingress enable --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --type external --target-port 8080 --transport auto
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "${{ env.IMAGE }}:${{ github.sha }}-live" --cpu 2 --memory 4Gi \
            --min-replicas 1 --max-replicas 1 \
            --set-env-vars CEVOC_PENALTY_LOOKUP_ADAPTER=scraper-evidence CEVOC_SCRAPER_ENABLED=true \
            CEVOC_SCRAPER_EVIDENCE_ENABLED=true CEVOC_SCRAPER_EVIDENCE_BROWSER=playwright \
            CEVOC_SCRAPER_CERTIFICATES_ENABLED=false CEVOC_LIVECHECK_ENABLED=true \
            "CEVOC_SCRAPER_EVIDENCE_BASE_URL=$CEVOC_BASE_URL" "CEVOC_SCRAPER_EVIDENCE_CONTACT=$LIVE_CONTACT" CEVOC_LIVECHECK_TOKEN= >/dev/null

      - name: Show what is deployed
        run: |
          az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "{images:properties.template.containers[].image, target:properties.configuration.ingress.targetPort, fqdn:properties.configuration.ingress.fqdn, latest:properties.latestRevisionName}" -o json
          az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,active:properties.active,traffic:properties.trafficWeight,health:properties.healthState,state:properties.runningState,created:properties.createdTime}" -o table

      - name: Check the app answers
        if: ${{ env.LIVE != 'true' }}
        run: |
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          bad=0
          # Not up yet (no answer, 502/503/504) may fix itself: wait up to about 2.5 minutes.
          # A real answer that is not 200 will not: three in a row is enough.
          for i in $(seq 1 30); do
            code=$(curl -m 15 -s -o /dev/null -w '%{http_code}' -X POST "https://$fqdn/api/penalty-lookups" \
              -H 'Content-Type: application/json' -d '{"infringementNumber":"9000000001","offenceDate":"2026-01-15"}' || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            case "$code" in 000|"" |502|503|504) bad=0;; *) bad=$((bad+1));; esac
            [ "$bad" -ge 3 ] && break
            sleep 5
          done
          echo "::error::App did not answer 200 (no answer for about 2.5 minutes, or three real non-200 replies). See the 'Show what is deployed' step and the Container App console log."
          exit 1

      # Live mode: do not call /api/penalty-lookups (it would hit the real site). /live-check/ping is harmless:
      # 401 without the token proves the guard is on, 200 with it proves the token and settings reached the app.
      - name: Check the live-check app answers
        if: ${{ env.LIVE == 'true' }}
        env:
          LIVE_CHECK_TOKEN: ${{ secrets.LIVE_CHECK_TOKEN }}
        run: |
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          bad=0
          for i in $(seq 1 30); do
            echo "attempt $i: HTTP $noauth"
            [ "$noauth" = "200" ] && exit 0
            # A real HTTP answer that is not success, many times in a row, will not fix itself: stop early.
            case "$noauth" in 000|""|502|503|504) bad=0;; *) bad=$((bad+1));; esac
            [ "$bad" -ge 3 ] && break
            sleep 5
          done
          curl -m 15 -s -i -H "Origin: https://calm-water-028cfd500.3.azurestaticapps.net" "https://$fqdn/live-check/ping" | head -12 | tr -d '\r' | while IFS= read -r l; do echo "::error::ping $l"; done || true
          curl -m 15 -s -i -X OPTIONS -H "Origin: https://calm-water-028cfd500.3.azurestaticapps.net" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: x-live-check-token,content-type" "https://$fqdn/live-check/lookup" | head -12 | tr -d '\r' | while IFS= read -r l; do echo "::error::preflight $l"; done || true
          echo "::error::last answer: HTTP $noauth"
          az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[0].{health:properties.healthState,state:properties.runningState,replicas:properties.replicas}" -o tsv | while IFS= read -r l; do echo "::error::revision $l"; done || true
          az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --type console --tail 300 --format text 2>&1 | grep -E "guard active|Started |ERROR|Exception|live-check" | cut -c1-300 | head -25 | while IFS= read -r l; do echo "::error::log $l"; done || true
          echo "::error::Live-check app did not answer as expected within about 4 minutes (Chromium image is larger; check the revision health and console log)."
          exit 1
