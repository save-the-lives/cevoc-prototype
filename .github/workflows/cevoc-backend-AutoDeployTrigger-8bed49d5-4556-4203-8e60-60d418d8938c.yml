name: Trigger auto deployment for cevoc-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/cevoc-backend-AutoDeployTrigger-8bed49d5-4556-4203-8e60-60d418d8938c.yml'

  # Allow manual trigger 
  workflow_dispatch:

concurrency:
  group: cevoc-backend-deploy
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  APP_NAME: cevoc-backend
  RESOURCE_GROUP: cevoc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CEVOCBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      # azure/container-apps-deploy-action cannot build from source without a registry:
      # it always pushes the image to acrName/registryUrl. So we build in ACR (no local
      # Docker needed) and point the app at that image. One-time setup: docs/DEPLOY-AZURE.md
      - name: Check registry is configured
        run: |
          if [ -z "$ACR_NAME" ]; then
            echo "::error::Repo variable ACR_NAME is not set. Create a Basic Azure Container Registry and set it (see docs/DEPLOY-AZURE.md)."
            exit 1
          fi

      - name: Build image in Azure Container Registry
        run: az acr build --registry "$ACR_NAME" --image "cevoc-backend:${{ github.sha }}" backend

      - name: Let the app pull from the registry
        run: |
          creds=$(az acr credential show --name "$ACR_NAME" --query "[username, passwords[0].value]" -o tsv)
          user=$(echo "$creds" | sed -n 1p); pass=$(echo "$creds" | sed -n 2p)
          echo "::add-mask::$pass"
          az containerapp registry set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_NAME.azurecr.io" --username "$user" --password "$pass"

      - name: Deploy new image
        run: |
          az containerapp ingress update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --target-port 8080
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/cevoc-backend:${{ github.sha }}"
