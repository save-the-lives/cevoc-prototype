name: Live check run (smoke-test cases through /live-check, prints only redacted summaries)
# Manual only. Uses the smoke test's secrets (LIVE_CASES_PASS, LIVE_CASES_FAIL) and sends each case to the app's
# /live-check/lookup endpoint, which exists only while the app was deployed with live_check=true (deploy-image-only.yml).
# With network_map, the summary adds the redacted call map (names and shapes only, no values). Values are masked.
on:
  workflow_dispatch:
    inputs:
      network_map:
        description: "Also print the redacted NETWORK MAP (structure only: paths with ids replaced, header and key names, value types, sizes). Default off."
        type: boolean
        default: false
      only:
        description: "Run only the cases whose label matches this regular expression (empty = all)"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
# Dev since 2026-11-17 (the first environment is deleted). The app must be deployed with live_check=true
# (deploy-image-only.yml), which switches the endpoint on until the next deploy without it.
env:
  APP_NAME: cevoc-dev-app
  RESOURCE_GROUP: rg-cevoc-dev
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Run the cases
        # Same cases as the smoke test: secrets LIVE_CASES_PASS and LIVE_CASES_FAIL (arrays of {id, input:{notice, date
        # YYYY-MM-DD, plate?, familyName?, givenNames?, organisation?}}, or an object holding the array under the secret's
        # name). Every value is masked before anything runs; only the app's redacted summary is printed.
        env:
          LIVE_CASES_PASS: ${{ secrets.LIVE_CASES_PASS }}
          LIVE_CASES_FAIL: ${{ secrets.LIVE_CASES_FAIL }}
          NETWORK_MAP: ${{ inputs.network_map }}
          ONLY: ${{ inputs.only }}
        run: |
          set +x
          cases=$(jq -cn --argjson p "${LIVE_CASES_PASS:-[]}" --argjson f "${LIVE_CASES_FAIL:-[]}" \
            '[($p | if type=="object" then .LIVE_CASES_PASS else . end)[], ($f | if type=="object" then .LIVE_CASES_FAIL else . end)[]]' 2>/dev/null) \
            || { echo "::error::LIVE_CASES_PASS / LIVE_CASES_FAIL are not valid JSON. Contents not shown."; exit 1; }
          while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done < <(printf %s "$cases" | jq -r '.[].input | .notice, .date, .plate, .familyName, .givenNames, .organisation | select(. != null)')
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          n=$(printf %s "$cases" | jq 'length')
          for i in $(seq 0 $((n-1))); do
            label=$(printf %s "$cases" | jq -r ".[$i].id // \"case $((i+1))\"")
            if [ -n "$ONLY" ] && ! printf %s "$label" | grep -Eq "$ONLY"; then continue; fi
            body=$(printf %s "$cases" | jq -c --arg nm "$NETWORK_MAP" ".[$i].input | {notice, offenceDate:.date, registration:(.plate // null), familyName, givenNames, organisation, networkMap:(\$nm==\"true\")}")
            code=$(curl -m 170 -s -o resp.txt -w '%{http_code}' -X POST "https://$fqdn/live-check/lookup" -H 'Content-Type: application/json' -d "$body" || true)
            echo "::group::$label (HTTP $code)"
            cat resp.txt
            echo
            echo "::endgroup::"
            { echo "### $label (HTTP $code)"; echo '```'; cat resp.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            sleep $((1 + RANDOM % 5))
          done
