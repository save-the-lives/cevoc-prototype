name: Live check run (reads the LIVE_CASES secret, prints only redacted summaries)
# Manual only. Repo secret LIVE_CASES is a JSON array, for example (fictitious values):
#   [{"label":"case 1","notice":"9000000004","date":"15/01/2026","plate":"TST123"},
#    {"label":"case 2","notice":"9000000001","date":"15/01/2026"}]
# "plate" is optional, "date" is DD/MM/YYYY. Each case is sent to the deployed app's live-check endpoint and only the
# app's redacted summary is printed under its label. Values are masked in the log and never echoed.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  APP_NAME: cevoc-backend
  RESOURCE_GROUP: cevoc
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CEVOCBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Run the cases
        env:
          LIVE_CASES: ${{ secrets.LIVE_CASES }}
        run: |
          set +x
          [ -n "$LIVE_CASES" ] || { echo "::error::Secret LIVE_CASES is not set."; exit 1; }
          # Mask every value first so nothing can leak into the log.
          while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done < <(printf %s "$LIVE_CASES" | jq -r '.[]? | .notice, .date, .plate' 2>/dev/null)
          printf %s "$LIVE_CASES" | jq -e 'type=="array" and length>0 and all(.[]; (.notice|type=="string") and (.date|test("^[0-9]{2}/[0-9]{2}/[0-9]{4}$")))' >/dev/null 2>&1 \
            || { echo "::error::LIVE_CASES is not valid. It must be a JSON array of {label, notice, date (DD/MM/YYYY), plate optional}. Contents not shown."; exit 1; }
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          n=$(printf %s "$LIVE_CASES" | jq 'length')
          echo "Running $n case(s) against the deployed app"
          for i in $(seq 0 $((n-1))); do
            label=$(printf %s "$LIVE_CASES" | jq -r ".[$i].label // \"case $((i+1))\"")
            body=$(printf %s "$LIVE_CASES" | jq -c ".[$i] | {notice:.notice, offenceDate:(.date[6:10]+\"-\"+.date[3:5]+\"-\"+.date[0:2]), registration:(.plate // null)}")
            code=$(curl -m 170 -s -o resp.txt -w '%{http_code}' -X POST "https://$fqdn/live-check/lookup" -H 'Content-Type: application/json' -d "$body" || true)
            echo "::group::$label (HTTP $code)"
            cat resp.txt
            echo
            echo "::endgroup::"
            { echo "### $label (HTTP $code)"; echo '```'; cat resp.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            sleep 6
          done
