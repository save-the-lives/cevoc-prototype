name: Demo probe (Playwright)

# Runs every demo case through the live site with real headless browsers.
# Supersedes demo-video-check.yml (curl-only check).

on:
  schedule:
    - cron: "42 * * * *"           # Hourly at :42 (jittered off the hour)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write                    # open/close issues on failure/recovery

concurrency:
  group: demo-probe
  cancel-in-progress: true

# The app's address follows scripts/app-url.sh (owner, 2026-11-17): looked up from Azure or set by a person, never typed
# in here. Site and API share one address since record 0031.
env:
  CEVOC_APP_NAME: cevoc-dev-app
  CEVOC_RESOURCE_GROUP: rg-cevoc-dev
  CEVOC_APP_URL_FROM_AZURE: ${{ vars.CEVOC_APP_URL_FROM_AZURE }}
  CEVOC_APP_URL: ${{ vars.CEVOC_APP_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the scheduled/workflow_run probe if the deploy failed

    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        if: vars.CEVOC_APP_URL_FROM_AZURE == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: App address
        id: app
        run: |
          scripts/app-url.sh
          url=$(sed -n 's/^url=//p' "$GITHUB_OUTPUT" | tail -1)
          echo "FRONTEND_URL=$url" >> "$GITHUB_ENV"
          echo "API_BASE=$url" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test@1.49.1
          npx playwright install --with-deps chromium webkit

      - name: Install Python deps for blur leak check
        run: pip install --break-system-packages opencv-python-headless numpy

      - name: Fetch demo cases
        id: cases
        run: |
          curl -sf "$API_BASE/api/demo/cases" -o /tmp/demo-cases.json
          echo "count=$(python3 -c 'import json; d=json.load(open("/tmp/demo-cases.json")); print(sum(len(c) for p in d.get("programs",[]) for g in p.get("groups",[]) for c in [g.get("cases",[])]))')" >> "$GITHUB_OUTPUT"
          echo "Demo cases fetched: $(cat /tmp/demo-cases.json | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(f"  {c[\"number\"]}: {c.get(\"title\",\"?\")}") for p in d.get("programs",[]) for g in p.get("groups",[]) for c in g.get("cases",[])]')"

      - name: Run demo probe
        run: npx playwright test --config=.github/demo-probe/playwright.config.js --reporter=list
        env:
          DEMO_CASES_FILE: /tmp/demo-cases.json

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-probe-screenshots
          path: test-results/
          retention-days: 7

      - name: Open or close issue on result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          ISSUE_TITLE="Demo probe failure"
          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number // empty')

          if [ "$RESULT" != "success" ]; then
            BODY="Demo probe failed at $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}

          Check the run logs and screenshots for details."
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label "bug"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Demo probe passed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Closing."
          fi
