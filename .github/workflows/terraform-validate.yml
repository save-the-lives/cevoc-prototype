name: Terraform Validate (AWS + Azure)

on:
  push:
    paths: ['infra/terraform/**']
  pull_request:
    paths: ['infra/terraform/**']

permissions:
  contents: read

jobs:
  validate-aws:
    name: AWS — fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8'

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

  validate-azure:
    name: Azure — fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/azure
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8'

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

  localstack-aws:
    name: AWS — LocalStack integration
    runs-on: ubuntu-latest
    needs: validate-aws
    if: github.event_name == 'push'
    services:
      localstack:
        image: localstack/localstack:3.4
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,ecr,ecs,elbv2,cloudwatch,cloudfront,iam,secretsmanager,sns,sts,logs
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.8'

      - name: Create LocalStack override
        run: |
          cat > _localstack_override.tf << 'EOF'
          provider "aws" {
            region                      = "ap-southeast-2"
            access_key                  = "test"
            secret_key                  = "test"
            skip_credentials_validation = true
            skip_metadata_api_check     = true
            skip_requesting_account_id  = true
            endpoints {
              ec2            = "http://localhost:4566"
              ecr            = "http://localhost:4566"
              ecs            = "http://localhost:4566"
              elasticloadbalancingv2 = "http://localhost:4566"
              cloudwatch     = "http://localhost:4566"
              cloudfront     = "http://localhost:4566"
              iam            = "http://localhost:4566"
              secretsmanager = "http://localhost:4566"
              sns            = "http://localhost:4566"
              sts            = "http://localhost:4566"
              logs           = "http://localhost:4566"
            }
            default_tags {
              tags = {
                Project     = "cevoc"
                Environment = "dev"
                ManagedBy   = "terraform"
              }
            }
          }
          EOF

      - name: Init + plan + apply
        run: |
          tofu init -upgrade
          tofu plan -var-file=environments/dev.tfvars -out=tfplan
          tofu apply tfplan

      - name: Cleanup
        if: always()
        run: |
          tofu destroy -var-file=environments/dev.tfvars -auto-approve 2>/dev/null || true
          rm -f _localstack_override.tf tfplan
