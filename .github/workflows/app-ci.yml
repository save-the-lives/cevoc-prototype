name: App CI (backend + frontend)
# Only the app. Changes under prototype/ never trigger this.
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
        working-directory: backend
  # Compiles and unit-tests the opt-in live-browser profile (Playwright classes). Launches no browser, no network to the site.
  backend-live-browser-profile:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Plive-browser test
        working-directory: backend
  # Builds both Docker variants (nothing pushed). The live variant must contain Chromium, and Chromium must start (--version)
  # so missing OS libraries show up here, not on the owner's phone. No site access.
  backend-docker-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Default image builds and has no browser
        run: |
          docker build -t cevoc-default backend
          docker run --rm --entrypoint sh cevoc-default -c 'test ! -d /ms-playwright && echo "default: no browser, ok"'
      - name: Live image builds and Chromium starts
        run: |
          docker build --build-arg LIVE_BROWSER=true -t cevoc-live backend
          docker run --rm --entrypoint sh cevoc-live -c '
            set -e
            ls /ms-playwright
            found=0
            for b in $(find /ms-playwright -type f \( -name chrome -o -name headless_shell \)); do
              echo "$b"; "$b" --version; found=1
            done
            [ "$found" = 1 ]
            id -un'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
