name: App CI (backend + frontend)
# Only the app. Changes under prototype/ never trigger this.
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
        working-directory: backend
  # Compiles and unit-tests the opt-in live-browser profile (Playwright classes). Launches no browser, no network to the site.
  backend-live-browser-profile:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Plive-browser test > "$RUNNER_TEMP/live.log" 2>&1
        working-directory: backend
      - name: Show errors as annotations
        if: failure()
        run: |
          msg=$(grep -E "ERROR|FAIL|Tests run:" "$RUNNER_TEMP/live.log" | head -30 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=live-browser build::$msg"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
