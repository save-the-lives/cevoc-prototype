name: App CI (backend + frontend)
# Only the app. Changes under prototype/ never trigger this.
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/app-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
