name: Release gate (frontend renders + live cases pass)
# The last job of every deploy. A deploy is green only when a real browser can use the deployed frontend AND the
# live cases pass against the deployed backend. Before this, "success" meant only that the upload finished.
# Can also be run by hand against any pair of addresses.
on:
  workflow_call:
    inputs:
      frontend_url:
        type: string
        required: true
      backend_url:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Site address (the same as the backend since record 0031), the deployed app address (deploys pass it themselves)"
        type: string
        required: true
      backend_url:
        description: "Backend address, the deployed app address (deploys pass it themselves)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  frontend:
    name: Frontend works in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Check the deployed site
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          BACKEND_URL: ${{ inputs.backend_url }}
        run: node scripts/release-gate.mjs

  demo-video:
    name: Demo video is served blurred
    # Opens a demo case in a real browser, takes the video address the page was given and waits for the server to
    # blur it (503 while blurring, 200 when done, 451 if blurring failed). Needs demo data switched on, as on dev.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Request the demo video and wait for the blurred copy
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          BACKEND_URL: ${{ inputs.backend_url }}
        run: node scripts/diagnose-video.mjs

  live-cases:
    name: Live cases pass
    # After the video check, not beside it: the blur takes the app's CPU for a minute, which made a Chromium lookup miss
    # its photos (2026-11-17). Runs whatever the video check's result.
    needs: demo-video
    if: always()
    uses: ./.github/workflows/pdvt.yml
    with:
      base_url: ${{ inputs.backend_url }}
    secrets: inherit
