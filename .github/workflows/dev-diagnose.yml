name: Dev diagnose (video + backend logs)
# Manual. Lets an agent or developer see what the deployed dev app is doing without the Azure portal or anyone's phone:
# requests a demo case's blurred video with timing, then prints the backend's recent log lines about the blur pipeline only.
# Demo data only. Ten-digit numbers are redacted from the printed log lines (the repository and its logs are public).
on:
  workflow_dispatch:
    inputs:
      demo_case:
        description: "Demo case number"
        type: string
        default: "0000000001"
      what:
        description: "all = video and logs too; quota = only the environment's core quota and usage (touches nothing)"
        type: choice
        options: [all, quota]
        default: all

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RG_NAME: rg-cevoc-dev
      APP_NAME: cevoc-dev-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Resolve addresses
        id: urls
        run: |
          APP=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "backend=https://$APP" >> "$GITHUB_OUTPUT"
          echo "frontend=https://$APP" >> "$GITHUB_OUTPUT"
          echo "Revision: $(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.latestRevisionName' -o tsv)"
          echo "Image:    $(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.template.containers[0].image' -o tsv)"
          echo "Size:     $(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.template.containers[0].resources' -o json | tr -d '\n ')"
      - name: Environment core quota and usage
        # Documented command (learn.microsoft.com/azure/container-apps/quotas): per-environment quotas such as consumption
        # cores, the sum of cores requested by every active replica. Read only.
        run: |
          ENV_NAME=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.environmentId' -o tsv | sed 's#.*/##')
          echo "Environment: $ENV_NAME"
          az containerapp env list-usages --resource-group "$RG_NAME" --name "$ENV_NAME" -o table
          echo "Apps in the environment and the cores each asks for:"
          az containerapp list --resource-group "$RG_NAME" --query "[].{app:name, cpu:properties.template.containers[0].resources.cpu, memory:properties.template.containers[0].resources.memory, minReplicas:properties.template.scale.minReplicas, maxReplicas:properties.template.scale.maxReplicas}" -o table
      - name: Install Playwright
        if: inputs.what != 'quota'
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Request the blurred video
        if: inputs.what != 'quota'
        id: video
        continue-on-error: true
        env:
          FRONTEND_URL: ${{ steps.urls.outputs.frontend }}
          BACKEND_URL: ${{ steps.urls.outputs.backend }}
          DEMO_CASE: ${{ inputs.demo_case }}
        run: node scripts/diagnose-video.mjs
      - name: Backend log lines about blur and errors
        if: inputs.what != 'quota'
        run: |
          az containerapp logs show --name "$APP_NAME" --resource-group "$RG_NAME" --tail 300 --format text > /tmp/app.log
          echo "Log lines fetched: $(wc -l < /tmp/app.log)"
          grep -iE "blur|ffmpeg|hls|python|traceback|killed|OutOfMemory|No such file|ModuleNotFound|MediaController|Penalty lookup route|revenue-nsw-http|Evidence providers|service path|evidence lookup|identity|WARN|ERROR" /tmp/app.log \
            | sed -E 's/[0-9]{10}/<number>/g' | cut -c1-400 | tail -150 > /tmp/filtered.log
          echo "Matching lines: $(wc -l < /tmp/filtered.log)"
          cat /tmp/filtered.log
      - name: Result
        if: inputs.what != 'quota' && steps.video.outcome != 'success'
        run: |
          echo "::error::The blurred video was not served; see the two steps above"
          exit 1
      - name: Blur worker log (record 0036)
        if: inputs.what != 'quota'
        run: |
          az containerapp logs show --name cevoc-dev-blur-worker --resource-group "$RG_NAME" --tail 50 --format text 2>&1 | tail -30 || true
