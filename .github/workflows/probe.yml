# TEMPORARY — diagnostic probe for Revenue NSW page shape discovery.
# Walks through each case in LIVE_CASES_PASS with Playwright, masks all values,
# and reports only the page structure: URLs, headings, field names, buttons,
# image counts, parser state. Delete once all enforcement programs are covered
# and the parser handles every page shape.
name: "Probe: Revenue NSW page shape"
on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Run only this case ID (blank = all pass cases)"
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Mask sensitive values
        env:
          LIVE_CASES_PASS: ${{ secrets.LIVE_CASES_PASS }}
        run: |
          node <<'MASK_SCRIPT'
          const raw = (process.env.LIVE_CASES_PASS || "").trim();
          if (!raw) { console.log("No LIVE_CASES_PASS secret"); process.exit(0); }
          let cases;
          try { cases = JSON.parse(raw); } catch { console.log("::error::LIVE_CASES_PASS is not valid JSON"); process.exit(1); }
          if (!Array.isArray(cases)) { console.log("::error::LIVE_CASES_PASS is not an array"); process.exit(1); }
          for (const c of cases) {
            if (c.input && c.input.notice) console.log("::add-mask::" + c.input.notice);
            if (c.input && c.input.date)   console.log("::add-mask::" + c.input.date);
            if (c.input && c.input.plate)  console.log("::add-mask::" + c.input.plate);
            if (c.input && c.input.familyName)   console.log("::add-mask::" + c.input.familyName);
            if (c.input && c.input.givenNames)   console.log("::add-mask::" + c.input.givenNames);
            if (c.input && c.input.organisation) console.log("::add-mask::" + c.input.organisation);
          }
          MASK_SCRIPT

      - name: Run probe
        env:
          LIVE_CASES_PASS: ${{ secrets.LIVE_CASES_PASS }}
          CASE_FILTER: ${{ inputs.case_id }}
        run: |
          node <<'PROBE_SCRIPT'
          const { chromium } = require('playwright');

          const LOGIN_URL = 'https://www.apps09.revenue.nsw.gov.au/customer_service/finesonline/';

          function loadCases() {
            const raw = (process.env.LIVE_CASES_PASS || "").trim();
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            const cases = Array.isArray(parsed) ? parsed : (parsed.LIVE_CASES_PASS || []);
            const filter = (process.env.CASE_FILTER || "").trim();
            return filter ? cases.filter(c => c.id === filter) : cases;
          }

          async function pageShape(page) {
            return page.evaluate(() => {
              const inputs = [...document.querySelectorAll('input')].map(i => ({
                name: i.name || i.id || '(unnamed)',
                type: i.type,
                disabled: i.disabled,
                visible: i.offsetParent !== null
              }));
              const buttons = [...document.querySelectorAll('button')].map(b => ({
                text: b.textContent.trim().substring(0, 30),
                visible: b.offsetParent !== null
              }));
              const headings = [...document.querySelectorAll('h1,h2,h3')].map(h => h.textContent.trim().substring(0, 60));
              const images = [...document.querySelectorAll('img')].filter(i => i.offsetParent !== null);
              const alerts = [...document.querySelectorAll('[role=alert]:not([hidden]), .alert, .error-message')]
                .map(e => e.textContent.trim()).filter(t => t.length > 0 && t.length < 200);
              const links = [...document.querySelectorAll('a[href]')].filter(a => a.offsetParent !== null)
                .map(a => ({ text: a.textContent.trim().substring(0, 40), href: a.href.substring(0, 120) }));
              return {
                url: location.href,
                title: document.title,
                headings,
                visibleInputs: inputs.filter(i => i.visible),
                hiddenInputs: inputs.filter(i => !i.visible),
                buttons: buttons.filter(b => b.visible),
                imageCount: images.length,
                alerts,
                linkCount: links.length
              };
            });
          }

          (async () => {
            const cases = loadCases();
            if (!cases.length) { console.log("No cases to probe."); return; }
            console.log(`Probing ${cases.length} case(s)...\n`);

            const browser = await chromium.launch();

            for (const c of cases) {
              console.log(`\n${'='.repeat(60)}`);
              console.log(`CASE: ${c.id} — ${c.description || '(no description)'}`);
              console.log(`${'='.repeat(60)}`);

              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              try {
                // Step 1: Login
                await page.goto(LOGIN_URL, { waitUntil: 'networkidle', timeout: 30000 });
                await page.fill('#pnn', c.input.notice);
                await page.fill('#dateOfOffence', c.input.date.replace(/(\d{4})-(\d{2})-(\d{2})/, '$3/$2/$1'));
                console.log('\n--- STEP 1: Login page (filled) ---');
                let shape = await pageShape(page);
                console.log(JSON.stringify(shape, null, 2));

                // Click Next
                await page.click('button:has-text("Next")');
                await page.waitForTimeout(5000);

                console.log('\n--- STEP 2: After first Next ---');
                shape = await pageShape(page);
                console.log(JSON.stringify(shape, null, 2));

                // Check for identity page (Skip button present)
                const skipBtn = page.locator('button:has-text("Skip")');
                const hasSkip = await skipBtn.count() > 0;
                console.log(`\nIdentity page detected: ${hasSkip}`);

                if (hasSkip) {
                  // Report identity page field names before skipping
                  const idFields = await page.evaluate(() => {
                    return [...document.querySelectorAll('input')].filter(i => i.offsetParent !== null)
                      .map(i => ({ name: i.name, id: i.id, formcontrolname: i.getAttribute('formcontrolname'), type: i.type }));
                  });
                  console.log(`Identity page fields: ${JSON.stringify(idFields)}`);

                  // Try Skip path first
                  await skipBtn.click();
                  await page.waitForTimeout(5000);
                  console.log('\n--- STEP 3a: After Skip ---');
                  shape = await pageShape(page);
                  console.log(JSON.stringify(shape, null, 2));
                }

                // Check for plate form
                const hasPlate = await page.locator('#vehicleNumber').count() > 0;
                console.log(`\nPlate form present: ${hasPlate}`);

                if (hasPlate && c.input.plate) {
                  await page.fill('#vehicleNumber', c.input.plate);
                  // The plate page has a "View images" button, not "Next"
                  const viewBtn = page.locator('button:has-text("View images")');
                  const nextBtn2 = page.locator('button:has-text("Next")');
                  if (await viewBtn.count() > 0) {
                    await viewBtn.click();
                  } else if (await nextBtn2.count() > 0) {
                    await nextBtn2.click();
                  }
                  await page.waitForTimeout(8000);
                  console.log('\n--- STEP 4: After plate submission ---');
                  shape = await pageShape(page);
                  console.log(JSON.stringify(shape, null, 2));
                } else if (hasPlate) {
                  console.log('Plate form present but no plate in input — skipping plate step.');
                }

                // --- STEP 5: Deep certificate probe ---
                console.log('\n--- STEP 5: Certificate deep probe ---');
                const certLink = await page.evaluate(() => {
                  const links = [...document.querySelectorAll('a')];
                  const cert = links.find(a => a.href && a.href.includes('certificateDetails'));
                  if (cert) return { href: cert.href, text: cert.textContent.trim() };
                  const byText = links.find(a => /certif/i.test(a.textContent));
                  if (byText) return { href: byText.href, text: byText.textContent.trim() };
                  return null;
                });
                if (certLink) {
                  console.log(`Certificate link found: text="${certLink.text}"`);
                  try {
                    // Follow the link IN THE SAME SESSION
                    await page.click(`a[href*="certificateDetails"], a:has-text("${certLink.text}")`);
                    await page.waitForTimeout(8000);

                    // (1) Camera Certification section structure: field labels only
                    const certSection = await page.evaluate(() => {
                      const headings = [...document.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h => h.textContent.trim());
                      const certIdx = headings.findIndex(h => /certif/i.test(h));
                      // Find labels/keys in the cert section
                      const labels = [...document.querySelectorAll('dt, th, label, .label, strong')]
                        .filter(el => el.offsetParent !== null)
                        .map(el => el.textContent.trim())
                        .filter(t => t.length > 0 && t.length < 100);
                      return { headings, certIdx, labels: [...new Set(labels)] };
                    });
                    console.log(`Cert section headings: ${JSON.stringify(certSection.headings)}`);
                    console.log(`Cert section labels: ${JSON.stringify(certSection.labels)}`);

                    // (2) Every link, button, embed on the cert page
                    const controls = await page.evaluate(() => {
                      const items = [];
                      for (const a of document.querySelectorAll('a[href]')) {
                        if (a.offsetParent === null) continue;
                        const href = a.href;
                        const masked = href.replace(/[?&](m|p|pnnum|token)=[^&]*/gi, (m, k) => `${k}=***`);
                        items.push({ type: 'link', text: a.textContent.trim().substring(0, 60), href: masked, target: a.target || '_self' });
                      }
                      for (const btn of document.querySelectorAll('button, input[type="submit"], input[type="button"]')) {
                        if (btn.offsetParent === null) continue;
                        items.push({ type: 'button', text: (btn.textContent || btn.value || '').trim().substring(0, 60) });
                      }
                      for (const em of document.querySelectorAll('embed, object, iframe')) {
                        if (em.offsetParent === null) continue;
                        const src = (em.src || em.data || '').replace(/[?&](m|p)=[^&]*/gi, (m, k) => `${k}=***`);
                        items.push({ type: em.tagName.toLowerCase(), src: src.substring(0, 200) });
                      }
                      return items;
                    });
                    console.log(`Controls on cert page: ${JSON.stringify(controls)}`);

                    // (3) Look for PDF/download controls and try to fetch
                    const pdfLinks = controls.filter(c =>
                      /pdf|download|view.*cert|print/i.test(c.text) ||
                      (c.href && /\.pdf|download|blob:/i.test(c.href))
                    );
                    console.log(`PDF/download controls: ${JSON.stringify(pdfLinks)}`);

                    // Try intercepting download responses
                    const downloadResults = [];
                    page.on('download', async (download) => {
                      const path = await download.path();
                      const fs = require('fs');
                      const bytes = path ? fs.readFileSync(path) : null;
                      downloadResults.push({
                        suggestedFilename: download.suggestedFilename(),
                        size: bytes ? bytes.length : 0,
                        isPdf: bytes && bytes.length > 4 && bytes.toString('utf8', 0, 4) === '%PDF'
                      });
                    });

                    // Also intercept network responses for PDF content
                    const pdfResponses = [];
                    page.on('response', async (resp) => {
                      const ct = resp.headers()['content-type'] || '';
                      if (/pdf|octet-stream/i.test(ct) || resp.url().includes('.pdf')) {
                        let size = 0;
                        let isPdf = false;
                        try {
                          const body = await resp.body();
                          size = body.length;
                          isPdf = size > 4 && body.toString('utf8', 0, 4) === '%PDF';
                        } catch {}
                        pdfResponses.push({ url: resp.url().replace(/[?&](m|p)=[^&]*/gi, '$1=***').substring(0, 200), contentType: ct, size, isPdf });
                      }
                    });

                    // Click any PDF/download button
                    for (const ctrl of pdfLinks) {
                      try {
                        if (ctrl.type === 'link') {
                          console.log(`Clicking PDF link: "${ctrl.text}"`);
                          await page.click(`a:has-text("${ctrl.text}")`);
                        } else if (ctrl.type === 'button') {
                          console.log(`Clicking PDF button: "${ctrl.text}"`);
                          await page.click(`button:has-text("${ctrl.text}"), input[value="${ctrl.text}"]`);
                        }
                        await page.waitForTimeout(5000);
                      } catch (e) {
                        console.log(`Click failed: ${e.message}`);
                      }
                    }
                    console.log(`Download results: ${JSON.stringify(downloadResults)}`);
                    console.log(`PDF responses intercepted: ${JSON.stringify(pdfResponses)}`);

                    // (4) Test plain HTTP fetch with session cookies
                    const cookies = await page.context().cookies();
                    const cookieHeader = cookies.map(c => `${c.name}=${c.value}`).join('; ');
                    // Mask cookie values in logs
                    console.log(`Session cookies count: ${cookies.length}`);
                    // Try HTTP fetch of the cert page URL with cookies
                    const http = require('http');
                    const https = require('https');
                    const certPageUrl = page.url();
                    try {
                      const httpResult = await new Promise((resolve, reject) => {
                        const req = https.get(certPageUrl, { headers: { 'Cookie': cookieHeader, 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                          const chunks = [];
                          res.on('data', d => chunks.push(d));
                          res.on('end', () => {
                            const body = Buffer.concat(chunks);
                            resolve({
                              status: res.statusCode,
                              contentType: res.headers['content-type'],
                              size: body.length,
                              isPdf: body.length > 4 && body.toString('utf8', 0, 4) === '%PDF',
                              hasHtml: body.toString('utf8', 0, 100).includes('<html') || body.toString('utf8', 0, 100).includes('<!DOCTYPE')
                            });
                          });
                        });
                        req.on('error', reject);
                        req.setTimeout(15000, () => { req.destroy(); reject(new Error('timeout')); });
                      });
                      console.log(`HTTP fetch of cert page: ${JSON.stringify(httpResult)}`);
                    } catch (httpErr) {
                      console.log(`HTTP fetch failed: ${httpErr.message}`);
                    }

                  } catch (certErr) {
                    console.log(`Certificate probe error: ${certErr.message}`);
                  }
                } else {
                  console.log('No certificate link found on this page.');
                }

                // Summary
                console.log('\n--- SUMMARY ---');
                console.log(`Final URL: ${page.url()}`);
                const finalShape = await pageShape(page);
                console.log(`Images on page: ${finalShape.imageCount}`);
                console.log(`Headings: ${JSON.stringify(finalShape.headings)}`);
                console.log(`Visible inputs: ${finalShape.visibleInputs.map(i => i.name).join(', ') || '(none)'}`);
                console.log(`Buttons: ${finalShape.buttons.map(b => b.text).join(', ') || '(none)'}`);
                console.log(`Alerts: ${finalShape.alerts.length > 0 ? JSON.stringify(finalShape.alerts) : '(none)'}`);

              } catch (err) {
                console.log(`\nERROR: ${err.message}`);
              } finally {
                await page.close();
              }
            }

            await browser.close();
            console.log('\nProbe complete.');
          })().catch(e => { console.error(e.message); process.exit(1); });
          PROBE_SCRIPT
