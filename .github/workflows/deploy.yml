name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: prototype
      - run: npm run build
        working-directory: prototype
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist
      # Downloadable copy of the same build, for hosting locally (relative paths and hash routing, so any folder works).
      - name: Package the site as a zip
        run: |
          # HOW-TO-RUN.txt ships from prototype/public (XAMPP/PHP and plain web server steps).
          test -s prototype/dist/HOW-TO-RUN.txt
          (cd prototype/dist && zip -qr ../../cevoc-site.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: cevoc-site
          path: cevoc-site.zip
  # GitHub Pages is off while the repo is private. Set the repo variable PAGES_ENABLED=true to turn this back on.
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # The "exam": install and update the site exactly as on the XAMPP server (Apache + PHP + SQLite,
  # /MSCR/cevoc-site/ subfolder, git clone -b site then git pull after each deploy) and check it.
  exam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq apache2 libapache2-mod-php php-sqlite3
      - run: npm install && npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
        working-directory: prototype
      - run: bash exam/run-exam.sh
        working-directory: prototype
  # Serve the zip, check it in a browser, then publish it as a release asset and on the `site` branch
  # (a local `git pull` of that branch is a deploy, with no build needed).
  package:
    needs: [build, exam]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cevoc-site
      - name: Check the zip works when served from a folder
        run: |
          mkdir -p /tmp/serve/copy && unzip -q cevoc-site.zip -d /tmp/serve/copy
          (cd /tmp/serve && python3 -m http.server 4180 >/dev/null 2>&1 &)
          npm install --no-save --prefix /tmp/pw playwright@1.49.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
          NODE_PATH=/tmp/pw/node_modules node prototype/scripts/check-site.cjs http://127.0.0.1:4180/copy/
      - name: Publish the zip as the site-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view site-latest >/dev/null 2>&1 || gh release create site-latest --title "Latest built site" --notes "Built from main on every deploy. Unzip, serve the folder (see HOW-TO-RUN.txt) and open it." --latest=false
          gh release upload site-latest cevoc-site.zip --clobber
      - name: Push the built site to the site branch
        # Commits on top of the branch (no force push), so the server's plain `git pull` keeps working.
        run: |
          rm -rf /tmp/site && mkdir /tmp/site && unzip -q cevoc-site.zip -d /tmp/site
          bash prototype/scripts/publish-site-branch.sh /tmp/site "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "Built site from ${GITHUB_SHA::7}"
