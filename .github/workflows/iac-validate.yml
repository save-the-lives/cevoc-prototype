name: IaC Validate & Deploy (Azure Dev)

on:
  push:
    paths: ['infra/azure/**', 'frontend/**', 'backend/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually deploy to rg-cevoc-dev (not just validate)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read

# ---------------------------------------------------------------------------
# PATTERN: config-driven optional dependencies
#
# Any worker/sidecar that is only needed for a specific config value follows
# the same rule:
#   - Build it always (so config changes take effect without a redeploy).
#   - If the build FAILS and the config DOES NOT require it → warning.
#   - If the build FAILS and the config DOES require it → error (blocks deploy).
#
# This applies to: browser worker (CEVOC_PENALTY_LOOKUP_ADAPTER=browser),
# blur worker (cevoc.blur.mode=queue), and any future optional sidecar.
# ---------------------------------------------------------------------------

jobs:
  # =========================================================================
  # Job 1: Validate (runs on every push to infra/azure/**)
  # =========================================================================
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Bicep lint & build
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
      - name: Validate deployment
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group validate \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table
      - name: What-if (dry run)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table

  # =========================================================================
  # Job 2: Deploy infra (only on workflow_dispatch with deploy=true)
  # =========================================================================
  deploy-infra:
    name: Deploy infrastructure
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    needs: validate
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    outputs:
      acr_name: ${{ steps.acr.outputs.name }}
      acr_login_server: ${{ steps.acr.outputs.login_server }}
      acr_found: ${{ steps.acr.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Pre-flight checks
        run: |
          echo "=== Pre-flight checks ==="
          FAIL=0
          for NS in Microsoft.App Microsoft.KeyVault Microsoft.OperationalInsights microsoft.insights Microsoft.ContainerRegistry Microsoft.Web; do
            STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATE" != "Registered" ]; then
              echo "::error::Provider $NS not registered. Run bootstrap.sh first."
              FAIL=1
            fi
          done
          DELETED_KVS=$(az keyvault list-deleted --query "[?starts_with(name,'cevoc')].name" -o tsv 2>/dev/null || true)
          if [ -n "$DELETED_KVS" ]; then
            echo "::error::Soft-deleted Key Vault(s): $DELETED_KVS. Run teardown.sh first."
            FAIL=1
          fi
          RG_EXISTS=$(az group exists --name "$RG_NAME" 2>/dev/null || echo "false")
          if [ "$RG_EXISTS" != "true" ]; then
            echo "::error::Resource group $RG_NAME does not exist. Run bootstrap.sh first."
            FAIL=1
          fi
          [ "$FAIL" -ne 0 ] && exit 1
          echo "All pre-flight checks passed."

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --mode Incremental \
            --output table

      - name: Get ACR login server
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group "$RG_NAME" --query '[0].name' -o tsv 2>/dev/null || true)
          if [ -z "$ACR_NAME" ]; then
            echo "::warning::No ACR found in $RG_NAME"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
            echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
            echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # Job 2b: Detect what actually changed (skip unchanged builds)
  # =========================================================================
  detect-changes:
    name: Detect changes
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    needs: deploy-infra
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    outputs:
      backend_changed: ${{ steps.check.outputs.backend_changed }}
      browser_changed: ${{ steps.check.outputs.browser_changed }}
      frontend_changed: ${{ steps.check.outputs.frontend_changed }}
      deployed_tag: ${{ steps.check.outputs.deployed_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for diff
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Check what changed since last deploy
        id: check
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          # What tag is currently deployed?
          DEPLOYED_IMAGE=$(az containerapp show --name "cevoc-dev-app" --resource-group "$RG_NAME" \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || echo "none")
          DEPLOYED_TAG=$(echo "$DEPLOYED_IMAGE" | grep -oP ':\K[^:]+$' || echo "none")
          echo "deployed_tag=$DEPLOYED_TAG" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: $DEPLOYED_IMAGE (tag: $DEPLOYED_TAG)"

          if [ "$DEPLOYED_TAG" = "$IMAGE_TAG" ]; then
            echo "Same commit already deployed — skipping all builds"
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            echo "browser_changed=false" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the commit for the deployed tag (7-char SHA prefix)
          DEPLOYED_COMMIT=$(git log --all --oneline | grep "^${DEPLOYED_TAG}" | head -1 | cut -d' ' -f1 || echo "")
          if [ -z "$DEPLOYED_COMMIT" ]; then
            echo "Can't find deployed commit $DEPLOYED_TAG — rebuilding everything"
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "browser_changed=true" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check each path for changes
          BACKEND=$(git diff --name-only "$DEPLOYED_COMMIT"..HEAD -- backend/ | head -1)
          FRONTEND=$(git diff --name-only "$DEPLOYED_COMMIT"..HEAD -- frontend/ | head -1)

          echo "backend_changed=$( [ -n "$BACKEND" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "browser_changed=$( [ -n "$BACKEND" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$( [ -n "$FRONTEND" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          echo "Backend changed: $( [ -n "$BACKEND" ] && echo yes || echo no )"
          echo "Browser changed: $( [ -n "$BACKEND" ] && echo yes || echo no )"
          echo "Frontend changed: $( [ -n "$FRONTEND" ] && echo yes || echo no )"

  # =========================================================================
  # Jobs 3a/3b/3c: Build images IN PARALLEL (skip if unchanged)
  # =========================================================================
  build-backend:
    name: Build backend image (lean)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    needs: [deploy-infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        if: needs.deploy-infra.outputs.acr_found == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Prepare build context
        run: |
          # Copy sample demo videos into backend/ context (Dockerfile expects them there)
          mkdir -p backend/samples
          cp frontend/public/samples/*.mp4 backend/samples/ 2>/dev/null || echo "No sample videos to copy"
      - name: Build and push
        if: needs.deploy-infra.outputs.acr_found == 'true'
        run: |
          ACR_NAME="${{ needs.deploy-infra.outputs.acr_name }}"
          LOGIN_SERVER="${{ needs.deploy-infra.outputs.acr_login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"
          DOCKERFILE=$( [ -f backend/Dockerfile.lean ] && echo "backend/Dockerfile.lean" || echo "backend/Dockerfile" )
          echo "Building $DOCKERFILE → ${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"

          # Use docker build + push (az acr build requires ACR Tasks, not available on Basic tier)
          az acr login --name "$ACR_NAME"
          docker build -t "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}" -t "${LOGIN_SERVER}/cevoc:latest" \
            -f "$DOCKERFILE" backend/
          docker push "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"
          docker push "${LOGIN_SERVER}/cevoc:latest"
          echo "Image pushed: ${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"

  build-browser-worker:
    name: Build browser worker image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    needs: [deploy-infra]
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        if: needs.deploy-infra.outputs.acr_found == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Build and push
        id: build
        if: needs.deploy-infra.outputs.acr_found == 'true'
        continue-on-error: true
        run: |
          if [ ! -f backend/Dockerfile.browser ]; then
            echo "::notice::No Dockerfile.browser — skipping"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACR_NAME="${{ needs.deploy-infra.outputs.acr_name }}"
          LOGIN_SERVER="${{ needs.deploy-infra.outputs.acr_login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Building browser worker → ${LOGIN_SERVER}/cevoc-browser-worker:${IMAGE_TAG}"
          az acr login --name "$ACR_NAME"
          docker build -t "${LOGIN_SERVER}/cevoc-browser-worker:${IMAGE_TAG}" \
            -t "${LOGIN_SERVER}/cevoc-browser-worker:latest" \
            -f backend/Dockerfile.browser backend/
          docker push "${LOGIN_SERVER}/cevoc-browser-worker:${IMAGE_TAG}"
          docker push "${LOGIN_SERVER}/cevoc-browser-worker:latest"
          echo "built=true" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build frontend
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    needs: [deploy-infra]
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    outputs:
      swa_url: ${{ steps.swa.outputs.url }}
      swa_token: ${{ steps.swa.outputs.token }}
      backend_url: ${{ steps.backend_url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Get backend URL
        id: backend_url
        run: |
          APP_URL=$(az containerapp show --name "cevoc-dev-app" --resource-group "$RG_NAME" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || true)
          if [ -z "$APP_URL" ]; then echo "::error::No backend URL"; exit 1; fi
          echo "url=https://${APP_URL}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.backend_url.outputs.url }}
        run: npm ci && npm run build
      - name: Get SWA deployment token
        id: swa
        run: |
          SWA_NAME=$(az staticwebapp list --resource-group "$RG_NAME" --query '[0].name' -o tsv 2>/dev/null || true)
          if [ -z "$SWA_NAME" ]; then echo "::error::No SWA in $RG_NAME"; exit 1; fi
          SWA_TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --query 'properties.apiKey' -o tsv)
          echo "::add-mask::${SWA_TOKEN}"
          echo "token=${SWA_TOKEN}" >> "$GITHUB_OUTPUT"
          SWA_HOSTNAME=$(az staticwebapp show --name "$SWA_NAME" --query 'defaultHostname' -o tsv)
          echo "url=https://${SWA_HOSTNAME}" >> "$GITHUB_OUTPUT"
      - name: Deploy to SWA
        run: |
          npm install -g @azure/static-web-apps-cli
          swa deploy ./frontend/dist \
            --deployment-token "${{ steps.swa.outputs.token }}" \
            --env production

  # =========================================================================
  # Job 4: Deploy apps + health check (waits for all builds)
  # =========================================================================
  deploy-apps:
    name: Deploy apps & verify
    needs: [deploy-infra, build-backend, build-browser-worker, build-frontend]
    if: always() && needs.deploy-infra.result == 'success' && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      # --- Config-driven optional dependency check (universal pattern) ---
      - name: Check optional dependencies
        run: |
          # For each optional worker: if its build failed AND the config requires it → error.
          # Otherwise → warning. Add new optional deps here following the same pattern.

          check_optional() {
            local NAME="$1" BUILD_RESULT="$2" CONFIG_VAR="$3" REQUIRED_VALUE="$4"
            if [ "$BUILD_RESULT" != "success" ]; then
              CURRENT=$(echo "$CONFIG_VAR" | tr '[:upper:]' '[:lower:]')
              if [ "$CURRENT" = "$REQUIRED_VALUE" ]; then
                echo "::error::${NAME} build failed and config requires it (${REQUIRED_VALUE})"
                return 1
              else
                echo "::warning::${NAME} build did not succeed (${BUILD_RESULT}), but config is '${CURRENT:-unset}' — continuing"
              fi
            fi
            return 0
          }

          FAIL=0
          check_optional "Browser worker" "${{ needs.build-browser-worker.result }}" \
            "${{ vars.CEVOC_PENALTY_LOOKUP_ADAPTER }}" "browser" || FAIL=1

          # Future: check_optional "Blur worker" "${{ needs.build-blur-worker.result }}" \
          #   "${{ vars.CEVOC_BLUR_MODE }}" "queue" || FAIL=1

          [ "$FAIL" -ne 0 ] && exit 1
          echo "All optional dependency checks passed."

      - name: Update container app
        run: |
          LOGIN_SERVER="${{ needs.deploy-infra.outputs.acr_login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"
          APP_NAME="cevoc-dev-app"

          # Grant AcrPull
          ACR_ID=$(az acr show --name "${{ needs.deploy-infra.outputs.acr_name }}" --query id -o tsv)
          APP_IDENTITY=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'identity.principalId' -o tsv)
          az role assignment create --assignee "$APP_IDENTITY" --role AcrPull --scope "$ACR_ID" --output none 2>/dev/null || true
          az containerapp registry set --name "$APP_NAME" --resource-group "$RG_NAME" \
            --server "${LOGIN_SERVER}" --identity system --output none

          # Simple update: image + env vars + cpu/memory. No custom probes —
          # Azure defaults work (this is how the manual deploy succeeded before).
          # Custom probes can be added later via Bicep once the app is confirmed working.
          az containerapp update --name "$APP_NAME" --resource-group "$RG_NAME" \
            --image "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}" \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=dev \
              CEVOC_DEMO_DATA_ENABLED=true \
              SERVER_PORT=8080 \
            --cpu 2.0 --memory 4Gi \
            --output table

      - name: Health check — backend
        run: |
          APP_NAME="cevoc-dev-app"
          BACKEND_URL="${{ needs.build-frontend.outputs.backend_url }}"

          # ---------- Self-diagnosing health check ----------
          # Collects ALL the information needed to diagnose failures without
          # anyone opening the Azure portal.

          echo "=== Revision status ==="
          REVISION=$(az containerapp revision list --name "$APP_NAME" --resource-group "$RG_NAME" \
            --query 'reverse(sort_by(@, &properties.createdTime))[0]' -o json 2>/dev/null || echo '{}')
          REV_NAME=$(echo "$REVISION" | jq -r '.name // "unknown"')
          echo "  Revision: $REV_NAME"
          echo "  Provisioning: $(echo "$REVISION" | jq -r '.properties.provisioningState // "unknown"')"
          echo "  Running: $(echo "$REVISION" | jq -r '.properties.runningState // "unknown"')"
          echo "  Image: $(echo "$REVISION" | jq -r '.properties.template.containers[0].image // "unknown"')"
          echo "  CPU: $(echo "$REVISION" | jq -r '.properties.template.containers[0].resources.cpu // "unknown"')"
          echo "  Memory: $(echo "$REVISION" | jq -r '.properties.template.containers[0].resources.memory // "unknown"')"

          # Show probe config so we can verify it was applied
          echo ""
          echo "=== Probe configuration ==="
          echo "$REVISION" | jq '.properties.template.containers[0].probes // []' 2>/dev/null || echo "(no probes)"

          echo ""
          echo "=== Waiting for healthy ==="
          for i in $(seq 1 24); do
            RUN_STATE=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RG_NAME" \
              --revision "$REV_NAME" --query 'properties.runningState' -o tsv 2>/dev/null || echo "unknown")
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${BACKEND_URL}/api/demo/cases" 2>/dev/null || echo "000")
            echo "  [$i/24] revision=$RUN_STATE http=$HTTP"

            [ "$HTTP" = "200" ] && echo "::notice::Backend healthy after $((i * 15))s" && exit 0

            if [ "$RUN_STATE" = "Failed" ] || [ "$RUN_STATE" = "Degraded" ]; then
              echo "::error::Revision entered $RUN_STATE"
              break
            fi
            sleep 15
          done

          # ---------- Collect diagnostics on failure ----------
          # Re-login: the OIDC token (5 min) may have expired during the health check wait
          az login --service-principal \
            --username "${{ secrets.AZURE_DEV_CLIENT_ID }}" \
            --tenant "${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}" \
            --federated-token "$(cat $ACTIONS_ID_TOKEN_REQUEST_URL)" 2>/dev/null \
            || az login --identity 2>/dev/null \
            || echo "::warning::Could not re-authenticate for diagnostics"
          echo ""
          echo "=== Application logs (stdout/stderr) ==="
          az containerapp logs show --name "$APP_NAME" --resource-group "$RG_NAME" \
            --tail 100 --format text 2>&1 || echo "(no application logs)"

          echo ""
          echo "=== System logs (probe failures, restarts, OOM) ==="
          # Log Analytics workspace query for system events
          LOG_WS=$(az containerapp env show \
            --name "$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.managedEnvironmentId' -o tsv | xargs -I{} basename {})" \
            --resource-group "$RG_NAME" \
            --query 'properties.appLogsConfiguration.logAnalyticsConfiguration.customerId' -o tsv 2>/dev/null || true)

          if [ -n "$LOG_WS" ]; then
            echo "Querying Log Analytics for container events..."
            az monitor log-analytics query --workspace "$LOG_WS" \
              --analytics-query "ContainerAppSystemLogs_CL | where RevisionName_s startswith 'cevoc-dev-app' | where TimeGenerated > ago(15m) | order by TimeGenerated desc | take 30" \
              --output table 2>&1 || echo "(Log Analytics query failed — data may not be ingested yet)"
          else
            echo "(Could not find Log Analytics workspace)"
          fi

          echo ""
          echo "=== Replica status ==="
          az containerapp replica list --name "$APP_NAME" --resource-group "$RG_NAME" \
            --revision "$REV_NAME" -o table 2>&1 || echo "(no replicas)"

          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Health check — frontend
        run: |
          FRONTEND_URL="${{ needs.build-frontend.outputs.swa_url }}"
          echo "Checking frontend at ${FRONTEND_URL}..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${FRONTEND_URL}" || true)
            echo "  Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "::notice::Frontend healthy" && exit 0
            sleep 5
          done
          echo "::error::Frontend not responding"
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          echo "========================================"
          echo "  CEVOC Dev Deployment"
          echo "========================================"
          echo "  Frontend: ${{ needs.build-frontend.outputs.swa_url }}"
          echo "  Backend:  ${{ needs.build-frontend.outputs.backend_url }}"
          echo "  Browser worker: ${{ needs.build-browser-worker.result }}"
          echo "========================================"
