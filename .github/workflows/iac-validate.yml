name: IaC Validate & Deploy (Azure Dev)

on:
  push:
    paths: ['infra/azure/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually deploy to rg-cevoc-dev (not just validate)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Lint, validate & what-if
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      # Step 1: Lint — catches syntax/type errors offline
      - name: Bicep lint & build
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      # Step 2: Validate — ARM checks the template against the subscription
      - name: Validate deployment
        run: |
          az deployment group validate \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table

      # Step 3: What-if — show what would be created (no actual deploy)
      - name: What-if (dry run)
        run: |
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table

      # Step 4: Clean stale resources from failed prior deploys
      - name: Clean stale resources
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          echo "Removing any stale resources from prior failed deploys..."
          RESOURCES=$(az resource list --resource-group "$RG_NAME" --query '[].id' -o tsv 2>/dev/null || true)
          if [ -n "$RESOURCES" ]; then
            echo "$RESOURCES" | while read -r id; do
              echo "  Deleting: $id"
              az resource delete --ids "$id" --output none 2>/dev/null || true
            done
            echo "  Waiting for deletions..."
            sleep 30
          else
            echo "  Resource group is clean."
          fi

      # Step 5: Deploy (only on manual trigger with deploy=true)
      - name: Deploy to rg-cevoc-dev
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --mode Incremental \
            --output table
