name: IaC Validate & Deploy (Azure Dev)

on:
  push:
    paths: ['infra/azure/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually deploy to rg-cevoc-dev (not just validate)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Lint, validate & deploy
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Bicep lint & build
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      # Pre-flight checks (deploy path only) — fail early with clear messages
      - name: Pre-flight checks
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          echo "=== Pre-flight checks ==="
          FAIL=0

          # 1. Check required resource providers
          echo "Checking resource providers..."
          for NS in Microsoft.App Microsoft.KeyVault Microsoft.OperationalInsights microsoft.insights Microsoft.ContainerRegistry; do
            STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATE" != "Registered" ]; then
              echo "::error::Provider $NS is not registered. Run bootstrap.sh first (it registers providers as subscription Owner)."
              FAIL=1
            fi
          done

          # 2. Check for soft-deleted Key Vaults that would block creation
          echo "Checking for soft-deleted Key Vaults..."
          DELETED_KVS=$(az keyvault list-deleted --query "[?starts_with(name,'cevoc')].name" -o tsv 2>/dev/null || true)
          if [ -n "$DELETED_KVS" ]; then
            echo "::error::Soft-deleted Key Vault(s) found: $DELETED_KVS. Run teardown.sh to purge them first."
            FAIL=1
          fi

          # 3. Check resource group exists
          echo "Checking resource group..."
          RG_EXISTS=$(az group exists --name "$RG_NAME" 2>/dev/null || echo "false")
          if [ "$RG_EXISTS" != "true" ]; then
            echo "::error::Resource group $RG_NAME does not exist. Run bootstrap.sh first."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Pre-flight checks failed. Fix the issues above before deploying."
            exit 1
          fi
          echo "All pre-flight checks passed."

      # Deploy (only on manual trigger with deploy=true, after pre-flight passes)
      - name: Deploy to rg-cevoc-dev
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --mode Incremental \
            --output table

      # Validate and what-if (non-deploy path: push trigger)
      - name: Validate deployment
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group validate \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table

      - name: What-if (dry run)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table
