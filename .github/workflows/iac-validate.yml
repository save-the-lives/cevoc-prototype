name: IaC Validate & Deploy (Azure Dev)

on:
  push:
    paths: ['infra/azure/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually deploy to rg-cevoc-dev (not just validate)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Lint, validate & deploy
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Bicep lint & build
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      # When deploying: clean first, then deploy (which validates internally)
      - name: Clean stale resources
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          echo "Removing any stale resources from prior failed deploys..."
          RESOURCES=$(az resource list --resource-group "$RG_NAME" --query '[].id' -o tsv 2>/dev/null || true)
          if [ -n "$RESOURCES" ]; then
            echo "$RESOURCES" | while read -r id; do
              echo "  Deleting: $id"
              az resource delete --ids "$id" --output none 2>/dev/null || true
            done
          else
            echo "  Resource group is clean."
          fi
          # Purge any soft-deleted Key Vaults that would block re-creation
          echo "Purging soft-deleted Key Vaults..."
          for kv in $(az keyvault list-deleted --query "[].name" -o tsv 2>/dev/null); do
            echo "  Purging: $kv"
            az keyvault purge --name "$kv" --output none 2>/dev/null || true
          done
          # Also try direct purge of the known vault name
          az keyvault purge --name "cevoc-4hyxfw5gm6kcq-kv" --output none 2>/dev/null || true
          echo "  Waiting for deletions to propagate..."
          sleep 30

      - name: Deploy to rg-cevoc-dev
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --mode Incremental \
            --output table

      # When not deploying: validate and what-if only
      - name: Validate deployment
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group validate \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table

      - name: What-if (dry run)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table
