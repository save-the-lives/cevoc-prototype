name: IaC Validate & Deploy (Azure Dev)

on:
  push:
    paths: ['infra/azure/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Actually deploy to rg-cevoc-dev (not just validate)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  validate:
    name: Lint, validate & deploy
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Bicep lint & build
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

      # Pre-flight checks (deploy path only) — fail early with clear messages
      - name: Pre-flight checks
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          echo "=== Pre-flight checks ==="
          FAIL=0

          # 1. Check required resource providers
          echo "Checking resource providers..."
          for NS in Microsoft.App Microsoft.KeyVault Microsoft.OperationalInsights microsoft.insights Microsoft.ContainerRegistry; do
            STATE=$(az provider show --namespace "$NS" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATE" != "Registered" ]; then
              echo "::error::Provider $NS is not registered. Run bootstrap.sh first (it registers providers as subscription Owner)."
              FAIL=1
            fi
          done

          # 2. Check for soft-deleted Key Vaults that would block creation
          echo "Checking for soft-deleted Key Vaults..."
          DELETED_KVS=$(az keyvault list-deleted --query "[?starts_with(name,'cevoc')].name" -o tsv 2>/dev/null || true)
          if [ -n "$DELETED_KVS" ]; then
            echo "::error::Soft-deleted Key Vault(s) found: $DELETED_KVS. Run teardown.sh to purge them first."
            FAIL=1
          fi

          # 3. Check Container App Environment count in target region
          echo "Checking Container App Environments in target region..."
          TARGET_REGION=$(grep "param location" infra/azure/parameters/dev.bicepparam | grep -oP "'[^']+'" | tr -d "'" || echo "australiasoutheast")
          ENV_COUNT=$(az containerapp env list --query "[?location=='${TARGET_REGION}'] | length(@)" -o tsv 2>/dev/null || echo "0")
          if [ "$ENV_COUNT" -ge 1 ]; then
            echo "::warning::$ENV_COUNT Container App Environment(s) already in $TARGET_REGION. Trial subscriptions allow 1 per region — deploy may fail."
          fi

          # 4. Check resource group exists
          echo "Checking resource group..."
          RG_EXISTS=$(az group exists --name "$RG_NAME" 2>/dev/null || echo "false")
          if [ "$RG_EXISTS" != "true" ]; then
            echo "::error::Resource group $RG_NAME does not exist. Run bootstrap.sh first."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Pre-flight checks failed. Fix the issues above before deploying."
            exit 1
          fi
          echo "All pre-flight checks passed."

      # Deploy (only on manual trigger with deploy=true, after pre-flight passes)
      - name: Deploy to rg-cevoc-dev
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --mode Incremental \
            --output table

      # --- Build, push image and update container app ---
      - name: Get ACR login server
        id: acr
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
        run: |
          ACR_NAME=$(az acr list --resource-group "$RG_NAME" --query '[0].name' -o tsv 2>/dev/null || true)
          if [ -z "$ACR_NAME" ]; then
            echo "::warning::No ACR found in $RG_NAME — skipping image push"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
            echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
            echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ACR: $ACR_NAME ($LOGIN_SERVER)"
          fi

      - name: Build and push image to ACR
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && steps.acr.outputs.found == 'true'
        run: |
          ACR_NAME="${{ steps.acr.outputs.name }}"
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "Building image: ${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"
          az acr build \
            --registry "$ACR_NAME" \
            --image "cevoc:${IMAGE_TAG}" \
            --image "cevoc:latest" \
            --file backend/Dockerfile \
            backend/ \
            2>&1 | tail -20

      - name: Update container app to use new image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && steps.acr.outputs.found == 'true'
        run: |
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"
          APP_NAME="cevoc-dev-app"

          echo "Updating ${APP_NAME} to ${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RG_NAME" \
            --image "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}" \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=dev \
              CEVOC_DEMO_DATA_ENABLED=true \
              SERVER_PORT=8080 \
            --output table

          # Get the app URL
          APP_URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "::notice::Dev app URL: https://${APP_URL}"
          echo "app_url=https://${APP_URL}" >> "$GITHUB_OUTPUT"

      # Validate and what-if (non-deploy path: push trigger)
      - name: Validate deployment
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group validate \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table

      - name: What-if (dry run)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy != 'true'
        run: |
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/parameters/dev.bicepparam \
            --output table
