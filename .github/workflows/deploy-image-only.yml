name: Deploy app image only (site and API; skips infra)

on:
  workflow_dispatch: {}

# One deploy to rg-cevoc-dev at a time, across both deploy workflows. Queue, never cancel a deploy half way.
concurrency:
  group: deploy-rg-cevoc-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RG_NAME: rg-cevoc-dev
      APP_NAME: cevoc-dev-app
    outputs:
      backend_url: ${{ steps.backend.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ secrets.CEVOCBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CEVOCBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR
        id: acr
        run: |
          ACR_NAME=$(az acr list --resource-group "$RG_NAME" --query '[0].name' -o tsv)
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "ACR: $LOGIN_SERVER"

      - name: Prepare context
        run: |
          mkdir -p backend/samples
          cp frontend/public/samples/*.mp4 backend/samples/ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build the site into the image context
        # One container serves the site and the API on one address (record 0031), so the site is built with no API
        # address (same origin) and copied into backend/site, which the Dockerfile serves from /app/site.
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run build
          rm -rf ../backend/site && mkdir -p ../backend/site && cp -r dist/. ../backend/site/
          test -f ../backend/site/index.html

      - name: Build and push backend
        run: |
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"
          DOCKERFILE="backend/Dockerfile"
          echo "Building $DOCKERFILE → ${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"
          az acr login --name "${{ steps.acr.outputs.name }}"
          docker build -t "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}" -t "${LOGIN_SERVER}/cevoc:latest" \
            -f "$DOCKERFILE" backend/
          docker push "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"
          docker push "${LOGIN_SERVER}/cevoc:latest"
          echo "Pushed ${LOGIN_SERVER}/cevoc:${IMAGE_TAG}"

      - name: Update container app
        run: |
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"
          IMAGE_TAG="${GITHUB_SHA::7}"
          az containerapp registry set --name "$APP_NAME" --resource-group "$RG_NAME" \
            --server "$LOGIN_SERVER" --identity system --output none
          az containerapp update --name "$APP_NAME" --resource-group "$RG_NAME" \
            --image "${LOGIN_SERVER}/cevoc:${IMAGE_TAG}" \
            --replace-env-vars \
              SPRING_PROFILES_ACTIVE=dev \
              CEVOC_DEMO_DATA_ENABLED=true \
              SERVER_PORT=8080 \
            --cpu 2.0 --memory 4Gi \
            --output table

      # --set-env-vars only adds, so a variable set by an earlier deploy stays on the app for ever
      # (a leftover CEVOC_PENALTY_LOOKUP_ADAPTER=stub silently switched real lookups off on 2026-11-17).
      # The list above is the whole truth: fail if the running app carries anything else. Names only, no values.
      - name: Verify env vars match this workflow (no drift)
        run: |
          EXPECTED="CEVOC_DEMO_DATA_ENABLED SERVER_PORT SPRING_PROFILES_ACTIVE"
          ACTUAL=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" \
            --query 'properties.template.containers[0].env[].name' -o tsv | sort | xargs)
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Container env vars differ from the workflow's list (drift). Expected [$EXPECTED], got [$ACTUAL]"
            exit 1
          fi

      - name: Health check
        id: backend
        run: |
          APP_URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Backend: https://${APP_URL}"
          echo "url=https://${APP_URL}" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 24); do
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${APP_URL}/api/demo/cases" 2>/dev/null || echo "000")
            echo "  [$i/24] http=$HTTP"
            [ "$HTTP" = "200" ] && echo "::notice::Backend healthy" && exit 0
            sleep 15
          done
          echo "::error::Backend not healthy"
          az containerapp logs show --name "$APP_NAME" --resource-group "$RG_NAME" --tail 50 --format text 2>&1 || true
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          APP_URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RG_NAME" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "unknown")
          echo "========================================"
          echo "  CEVOC Dev Deployment"
          echo "========================================"
          echo "  App (site and API): https://${APP_URL}"
          echo "========================================"

  # A deploy is green only when the deployed site works in a real browser and the live cases pass.
  release-gate:
    needs: deploy
    uses: ./.github/workflows/release-gate.yml
    with:
      frontend_url: ${{ needs.deploy.outputs.backend_url }}
      backend_url: ${{ needs.deploy.outputs.backend_url }}
    secrets: inherit
